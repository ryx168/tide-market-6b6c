name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax
        run: |
          node --check site/games/street-walk/game.js
          node --check site/games/street-walk/map.js
          node --check site/shared/level.js
      - name: CJK font, so the stills show the 繁體中文 labels instead of boxes
        run: sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - name: Install puppeteer
        run: npm install --no-save puppeteer@23
      - name: Play one round under SwiftShader
        run: node scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stills
          path: stills

  pages:
    needs: smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
